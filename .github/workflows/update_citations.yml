name: Update Google Scholar citations
on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install deps
        run: pip install requests beautifulsoup4
      - name: Fetch citations
        env:
          SCHOLAR_URL: ${{ secrets.SCHOLAR_URL }}  # set this secret to your profile URL (public is fine)
        run: python scripts/get_citation_count.py
      - name: Commit updated data
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions[bot]
          author_email: github-actions[bot]@users.noreply.github.com
          message: "chore: update Google Scholar citation count"
          add: "data/citations.json"
